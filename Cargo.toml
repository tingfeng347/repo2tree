[package]
name = "repo2tree"
version = "0.1.0"
edition = "2024"
description = "Local code atlas and explicit, scenario-driven code flow player"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }

[dev-dependencies]
tempfile = "3"
